name: Build Moonlight V+ for PC

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Rebuild a version tag and replace its existing release assets
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  qml-lint:
    # QML type-resolution errors can fail at runtime even when qmlcachegen and all builds pass.
    # Run a separate lint check with Qt installed, in parallel with platform builds.
    runs-on: ubuntu-latest

    # This job executes scripts from the PR. Restrict its token to read-only and do not
    # persist checkout credentials, so edited scripts cannot gain repository write access.
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        modules: 'qtmultimedia qtimageformats'
        cache: true
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

    - name: Check QML type resolution
      run: scripts/qmllint-check.sh

  version-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Test version derivation
      run: |
        python3 -m unittest discover -s tests/derive_version -p 'test_*.py'
        python3 -m unittest discover -s tests/upstream_status -p 'test_*.py'

  cpp-format:
    # Check only C++ lines changed from the target branch. Whole-tree formatting would
    # create unnecessary conflicts when merging upstream. Keep permissions read-only.
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install pinned clang-format
      run: |
        # Pin the formatter version; different versions can produce different output.
        # Install the same version locally before running git clang-format. The PyPI
        # package includes the driver; ~/.local/bin takes precedence over the runner's copy.
        pipx install clang-format==21.1.8
        command -v clang-format git-clang-format
        clang-format --version

    - name: Check formatting of changed lines
      env:
        BASE_REF: ${{ github.base_ref }}
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        # Select the formatting baseline for each event:
        # pull_request: merge-base with its target; push: the previous commit.
        # For a release or tag dispatch, the baseline can be HEAD because the
        # commit was already checked when it reached master.
        if [ -n "$BASE_REF" ]; then
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
        elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
          BASE=$BEFORE
        else
          BASE=$(git merge-base origin/master HEAD)
        fi
        echo "Formatting baseline: $BASE (event=$EVENT_NAME)"
        # Report formatting changes only for touched lines, without changing the worktree.
        # Clean results use messages such as 'no modified files to format'.
        OUTPUT=$(git clang-format --diff --style file "$BASE" 2>&1)
        case "$OUTPUT" in
          none|*"no modified files to format"|*"clang-format did not modify any files")
            echo "Formatting check passed"
            ;;
          *)
            echo "$OUTPUT"
            echo "::error::Changed C++ lines need formatting. Install clang-format==21.1.8 and run git clang-format locally."
            exit 1
            ;;
        esac


  build-windows:
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get version
      shell: cmd
      run: |
        rem Resolve the version before dependency setup or builds modify tracked files.
        rem Store CI_VERSION so subsequent version derivation does not add a .dirty suffix.
        for /f "delims=" %%i in ('python scripts\derive-version.py --field artifact') do echo VERSION=%%i >> %GITHUB_ENV%
        for /f "delims=" %%i in ('python scripts\derive-version.py --field artifact') do echo CI_VERSION=%%i >> %GITHUB_ENV%

    - name: Download dependencies
      shell: pwsh
      run: ./setup-deps.ps1

    - name: Install Qt
      uses: jdpurcell/install-qt-action@v5
      with:
        arch: win64_msvc2022_64
        host: windows
        target: desktop
        version: '6.11.1'
        modules: 'qtmultimedia qtimageformats'
        use-naqt: true

    - name: Setup build environment
      shell: cmd
      run: |
        echo Setting up optimized build environment...
        set NUMBER_OF_PROCESSORS=2
        set JOM_MAX_CPUS=%NUMBER_OF_PROCESSORS%
        echo JOM_MAX_CPUS=%JOM_MAX_CPUS% >> %GITHUB_ENV%
        rem Increase virtual memory to prevent out-of-memory issues
        where wmic >nul 2>nul
        if %ERRORLEVEL% EQU 0 (
          wmic pagefileset where name="C:\\pagefile.sys" set InitialSize=4096,MaximumSize=8192 || echo Failed to set pagefile size
          wmic computersystem where name="%computername%" set AutomaticManagedPagefile=False || echo Failed to disable automatic pagefile management
        ) else (
          echo wmic is not available; skipping pagefile tuning.
        )

    - name: Configure build environment
      shell: cmd
      run: |
        echo Configuring build environment for stability...
        rem Set environment variables for stable build
        set CL=/MP2 /Zm500
        set LINKER=/OPT:REF,ICF=5
        rem Disable incremental linking to reduce memory usage
        set LINK=/INCREMENTAL:NO
        rem Disable problematic features during configure
        set QMAKE_CXXFLAGS=-DWIN32_LEAN_AND_MEAN
        echo CL=%CL% >> %GITHUB_ENV%
        echo LINK=%LINK% >> %GITHUB_ENV%
        echo QMAKE_CXXFLAGS=%QMAKE_CXXFLAGS% >> %GITHUB_ENV%
        rem Don't set MAKEFLAGS as it interferes with jom

    - name: Prepare CI build environment
      shell: cmd
      run: |
        echo Preparing CI-specific build configuration...
        rem Create a CI-specific environment variable
        echo MOONLIGHT_CI_BUILD=1 >> %GITHUB_ENV%
        echo CI build environment prepared

    - name: Build Windows x64
      shell: cmd
      run: |
        echo Starting CI-optimized build...

        rem Clear any problematic environment variables
        set MAKEFLAGS=
        set _CL_=

        rem Build with standard configuration and correct architecture
        echo Building with CI optimizations...
        call scripts\build-arch.bat release x64
        if errorlevel 1 exit /b %ERRORLEVEL%

        echo Build Windows x64 completed successfully!

    - name: Test input & overlay logic
      shell: cmd
      run: |
        rem Shared test entry point: qmake, jom release, then execution. See the script header.
        rem Add each new test with a call followed by an errorlevel check.
        call scripts\run-test.bat ds5_ir_renderer ds5_ir_renderer_test
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat pen_history_selection pen_history_selection_test
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat stylus_replay stylus_replay_test
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat overlay_event_wake_state overlay_event_wake_state
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat overlay_button_native_wake overlay_button_native_wake
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat overlay_toast_event_state overlay_toast_event_state
        if errorlevel 1 exit /b %ERRORLEVEL%
        rem QTest synthesizes mouse events; use offscreen because CI has no desktop session.
        set QT_QPA_PLATFORM=offscreen
        call scripts\run-test.bat overlay_menu_navigation overlay_menu_navigation
        if errorlevel 1 exit /b %ERRORLEVEL%

    - name: Test compiled Chinese translations and settings navigation layout
      shell: cmd
      run: |
        rem qmltestrunner has its own invocation and does not use run-test.bat.
        lrelease app\languages\qml_zh_CN.ts
        if errorlevel 1 exit /b %ERRORLEVEL%
        set QT_QPA_PLATFORM=offscreen
        qmltestrunner -input tests\settings_localization -translation app\languages\qml_zh_CN.qm
        if errorlevel 1 exit /b %ERRORLEVEL%

    - name: Test clipboard / cursor / file-mapping / overlay layout logic
      shell: cmd
      run: |
        rem These QCoreApplication logic tests were validated with Qt 6.11.1 and MSVC.
        call scripts\run-test.bat cursor_shape_classification cursor_shape_classification
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat clipboard_payload_routing clipboard_payload_routing
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat overlay_button_position overlay_button_position
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat file_mapping_websocket_framing file_mapping_websocket_framing
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat file_mapping_mirror_e2e file_mapping_mirror_e2e
        if errorlevel 1 exit /b %ERRORLEVEL%

    - name: Test USB forwarding logic
      shell: cmd
      run: |
        call scripts\run-test.bat usb_forwarding_capability usb_forwarding_capability_test
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat usb_forwarding_environment usb_forwarding_environment_test
        if errorlevel 1 exit /b %ERRORLEVEL%
        call scripts\run-test.bat usb_forwarding_backend_list usb_forwarding_backend_list_test
        if errorlevel 1 exit /b %ERRORLEVEL%
        rem usb_forwarding_tunnel requires a real USB/IP session and is a manual probe.
        rem See tests/README.md for usage.

    - name: Install Qt arm64
      uses: jdpurcell/install-qt-action@v5
      with:
        arch: win64_msvc2022_arm64_cross_compiled
        dir: ${{ github.workspace }}\arm64\
        host: windows
        target: desktop
        version: '6.11.1'
        modules: 'qtmultimedia qtimageformats'
        use-naqt: true

    - name: Build Windows arm64
      shell: cmd
      run: |
        rem Force the ARM64 Qt bin to the front of PATH so that build-arch.bat's
        rem `where qmake.bat` / `where qmake.exe` resolves to the cross-compiled
        rem ARM64 Qt instead of the x64 Qt installed earlier in this job. Without
        rem this, windeployqt would deploy x64 Qt DLLs into the ARM64 portable
        rem package, producing 0xc000007b on launch (qiin2333/moonlight-qt#71).
        set "PATH=%Qt6_DIR%\bin;%PATH%"
        call scripts\build-arch.bat release arm64
        if errorlevel 1 exit /b %ERRORLEVEL%
        for %%f in (build\installer-arm64-release\Moonlight-VPlus-Portable-arm64-*.zip) do powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-pe-machine.ps1 -Path "%%f" -ExpectedMachine 0xAA64
        if errorlevel 1 exit /b %ERRORLEVEL%

    - name: Generate universal installer
      shell: cmd
      run: |
        call scripts\generate-bundle.bat release
        if errorlevel 1 exit /b %ERRORLEVEL%

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-VPlus-Portable-x64-r${{ env.BUILD_NUMBER }}
        path: |
          build/installer-x64-release/Moonlight-VPlus-Portable-x64-*.zip
          build/installer-x64-release/MoonlightPortable-x64-*.zip

    - name: Upload portable artifact arm64
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-VPlus-Portable-arm64-r${{ env.BUILD_NUMBER }}
        path: |
          build/installer-arm64-release/Moonlight-VPlus-Portable-arm64-*.zip
          build/installer-arm64-release/MoonlightPortable-arm64-*.zip

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-VPlus-Setup-r${{ env.BUILD_NUMBER }}.exe
        path: |
          build/installer-Release/Moonlight-VPlus-Setup-*.exe
          build/installer-Release/MoonlightSetup-*.exe

  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get version
      run: |
        VERSION=$(python3 scripts/derive-version.py --field artifact)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "CI_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install create-dmg
      run: |
        brew install node
        npm install --global create-dmg

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        modules: 'qtmultimedia qtimageformats'
        cache: true
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

    - name: Test macOS overlay event wakeups
      run: |
        python3 setup-deps.py
        pushd tests/overlay_button_native_wake
        qmake overlay_button_native_wake.pro
        make -j"$(sysctl -n hw.ncpu)"
        DYLD_LIBRARY_PATH="$PWD/../../libs/mac/lib" ./overlay_button_native_wake
        popd

    - name: Build and generate DMG
      run: |
        scripts/generate-dmg.sh Release

    - name: Smoke test USB forwarding helper
      run: |
        HELPER="build/build-Release/app/Moonlight.app/Contents/MacOS/moonlight-usbd"
        test -x "$HELPER"
        # Statically link libusb/usbipdcpp: Homebrew dylibs may work on the runner
        # but will not be available on end-user machines.
        if otool -L "$HELPER" | grep -q "libusb"; then
          otool -L "$HELPER"
          echo "helper dynamically links libusb!" >&2
          exit 1
        fi
        "$HELPER" --version
        "$HELPER" list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d, list)'

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-VPlus-r${{ env.BUILD_NUMBER }}.dmg
        path: build/installer-Release/Moonlight-VPlus-*.dmg
        if-no-files-found: error

  build-linux:
    # Use the standard x86_64 runner and GitHub's public-repository ARM runner.
    #
    # x86_64 stays on Ubuntu 22.04 for a glibc 2.35 AppImage baseline.
    # Qt's ARM64 tools require glibc 2.38, so ARM64 uses Ubuntu 24.04.
    # Its AppImage needs glibc >= 2.39 and cannot run on Debian 12 / Raspberry Pi
    # OS bookworm; use trixie or later. An older baseline requires building Qt.
    name: build-linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_UPDATE_TAG: ${{ github.event_name == 'release' && github.event.release.prerelease && 'latest-pre' || 'latest' }}

    strategy:
      # Keep one architecture's failure from cancelling the other architecture's diagnostics.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            multiarch: x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            multiarch: aarch64-linux-gnu

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get version
      run: |
        VERSION=$(python3 scripts/derive-version.py --field artifact)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "CI_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install Qt 6.11.1
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        host: ${{ matrix.qt_host }}
        arch: ${{ matrix.qt_arch }}
        modules: 'qtmultimedia qtimageformats'
        cache: true

    - name: Setup local env and metadata
      run: |
        mkdir -p $HOME/local/{bin,include,lib}
        echo "$HOME/local/bin" >> $GITHUB_PATH
        echo "PKG_CONFIG_PATH=$HOME/local/lib/pkgconfig:$HOME/local/lib/${{ matrix.multiarch }}/pkgconfig" >> $GITHUB_ENV
        echo "UBUNTU_RELEASE=$(lsb_release -rs)" >> $GITHUB_ENV

    # Cache expensive SDL3/FFmpeg/libplacebo compilation. Dependency revisions are pinned,
    # allowing high cache reuse; incremental application builds also benefit.
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-linux-${{ matrix.arch }}-${{ github.run_id }}
        restore-keys: |
          ccache-linux-${{ matrix.arch }}-

    - name: Install ccache
      run: |
        sudo apt-get install -y ccache
        # Put compiler wrappers first so cmake, make, and configure use ccache transparently.
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        ccache --max-size=2G
        ccache -z

    # Qt 6.11.1 and its qmake are already installed. Do not install distro Qt packages:
    # they would go unused and could be included accidentally during AppImage packaging.
    # Stay on 6.11.1 while investigating native overlay wake failures with Qt 6.11.2 XCB.
    - name: Install packaged deps
      run: |
        # LunarG provides amd64/i386 packages, not ARM64. Use its SDK on x86_64;
        # ARM64 needs the distro loader plus separately built Vulkan components.
        if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          # LunarG 1.4.313 provides jammy/noble lists, not focal. This matrix uses jammy.
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-jammy.list
        fi
        sudo apt update || true
        sudo apt install -y \
          python3-pip nasm libgbm-dev libdrm-dev libfreetype6-dev libasound2-dev \
          libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev \
          libibus-1.0-dev libpulse-dev libudev-dev libx11-dev libxcursor-dev libxext-dev \
          libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxss-dev libxt-dev \
          libxv-dev libxxf86vm-dev libxcb1-dev libxcb-dri3-dev libx11-xcb-dev libwayland-dev wayland-protocols \
          libxfixes-dev libxtst-dev libpipewire-0.3-dev \
          libopus-dev libvdpau-dev cmake xvfb xauth

        if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
          sudo apt install -y vulkan-sdk
        else
          # libplacebo needs a SPIR-V compiler for a working Vulkan renderer.
          # Both LunarG on x86_64 and noble's libshaderc-dev provide shaderc 2023.8.
          # Prefer shaderc's pkg-config detection: glslang's SPIRV library was not
          # detected reliably even when installed under /usr/local.
          sudo apt install -y libshaderc-dev
        fi

        # Install XCB runtime libraries for Qt6 XCB platform plugin
        echo "Installing XCB runtime libraries..."
        sudo apt install -y libxcb1 libxcb-cursor0 libxcb-keysyms1 libxcb-image0 libxcb-shm0 libxcb-icccm4 libxcb-sync1 libxcb-xfixes0 libxcb-shape0 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1

        # Ubuntu 24.04 enforces PEP 668, but its Meson 1.3 meets libplacebo's >= 0.63
        # requirement. Jammy ships Meson 0.61 and still needs the pip installation.
        if [[ $UBUNTU_RELEASE == "24.04" ]]; then
          sudo apt install -y meson
        else
          sudo pip3 install meson
        fi

        if [[ $UBUNTU_RELEASE == "22.04" ]]; then
          # Needed for AppImage
          sudo apt install libfuse2
        fi

    - name: Test Linux display event wakeups
      run: |
        pushd tests/linux_display_event_monitor
        qmake linux_display_event_monitor.pro
        make -j"$(nproc)"
        ./linux_display_event_monitor
        popd

        pushd tests/overlay_button_native_wake
        qmake overlay_button_native_wake.pro
        make -j"$(nproc)"
        # Runner load can disturb XTest/asynchronous wake ordering under xvfb.
        # Retry the complete test once if a wake assertion fails.
        QT_QPA_PLATFORM=xcb xvfb-run -a ./overlay_button_native_wake ||         QT_QPA_PLATFORM=xcb xvfb-run -a ./overlay_button_native_wake
        popd

    # ARM64 lacks the LunarG repository. Noble's Vulkan loader 1.3.275 is older
    # than FFmpeg's >= 1.3.277 requirement. Build both Headers and Loader:
    # Loader installs vulkan.pc; Headers alone cannot satisfy configure.
    - name: Build Vulkan loader (aarch64)
      if: matrix.arch == 'aarch64'
      run: |
        export VULKAN_VER=v1.4.313
        git clone --branch $VULKAN_VER --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git
        cmake -S Vulkan-Headers -B Vulkan-Headers/build
        sudo cmake --install Vulkan-Headers/build

        git clone --branch $VULKAN_VER --depth 1 https://github.com/KhronosGroup/Vulkan-Loader.git
        cmake -S Vulkan-Loader -B Vulkan-Loader/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH=/usr/local \
          -DBUILD_TESTS=OFF
        cmake --build Vulkan-Loader/build -j$(nproc)
        sudo cmake --install Vulkan-Loader/build
        sudo ldconfig

        pkg-config --modversion vulkan
    - name: Build SDL3
      run: |
        export SDL3_REV=ddba673cddfa79ce798eca5ba402e0f1a2a2a243
        git clone https://github.com/libsdl-org/SDL.git SDL3
        cd SDL3
        git checkout $SDL3_REV
        cmake -DSDL_KMSDRM=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_INSTALL_DOCS=OFF -S . -B build
        cmake --build build -j$(nproc)
        sudo cmake --install build
        sudo ldconfig
        cd ..

    - name: Build sdl2-compat
      run: |
        # Immutable commit for release-2.32.70; mutable refs can change a workflow's sources.
        export SDL2_COMPAT_REV=a53b6ad90ecd2d0ccfe01d5cfd2059793acf8c12
        git clone https://github.com/libsdl-org/sdl2-compat.git sdl2-compat
        cd sdl2-compat
        git checkout $SDL2_COMPAT_REV
        cmake -DSDL2COMPAT_TESTS=OFF -S . -B build
        cmake --build build -j$(nproc)
        sudo cmake --install build
        sudo ldconfig
        cd ..

    - name: Build SDL2_ttf
      run: |
        export SDL2_TTF_REV=a883e490e30fb44a5336ea3dcb990c6982c5216f
        git clone https://github.com/libsdl-org/SDL_ttf.git SDL_ttf
        cd SDL_ttf
        git checkout $SDL2_TTF_REV
        git submodule update --init --recursive
        ./autogen.sh
        ./configure
        make -j$(nproc)
        sudo make install
        cd ..

    - name: Build libva
      run: |
        export LIBVA_VER=2.24.1
        git clone --branch $LIBVA_VER --depth 1 https://github.com/intel/libva.git
        cd libva
        ./autogen.sh

        # Configure with conditional Wayland support
        echo "Configuring libva..."
        if pkg-config --exists wayland-client; then
          echo "Configuring libva with Wayland support"
          ./configure --enable-x11 --enable-wayland
        else
          echo "Configuring libva without Wayland support"
          ./configure --enable-x11 --disable-wayland
        fi

        make -j$(nproc)
        sudo make install
        sudo ldconfig
        cd ..

    - name: Build dav1d
      run: |
        export DAV1D_VER=1.5.4
        git clone --branch $DAV1D_VER --depth 1 https://code.videolan.org/videolan/dav1d.git
        cd dav1d
        meson setup build -Ddefault_library=static -Dbuildtype=release -Denable_tools=false -Denable_tests=false
        ninja -C build
        sudo ninja install -C build
        sudo ldconfig
        cd ..

    - name: Build libplacebo
      run: |
        export LIBPLACEBO_REV=41ac2980e1a898f41d7c2e07999f9862ee89d99f
        git clone https://code.videolan.org/videolan/libplacebo.git
        cd libplacebo
        git checkout $LIBPLACEBO_REV
        if [ -f ../app/deploy/linux/appimage/*.patch ]; then
          git apply ../app/deploy/linux/appimage/*.patch
        fi
        git submodule update --init --recursive
        meson setup build -Dvulkan=enabled -Dopengl=disabled -Ddemos=false
        # libplacebo can build without shaderc or glslang while producing a nonfunctional
        # Vulkan renderer. Fail explicitly instead of allowing that silent degradation.
        if ! grep -qE "^ +(shaderc|glslang) +: +YES" build/meson-logs/meson-log.txt; then
          echo "::error::libplacebo found no SPIR-V compiler (shaderc/glslang); the Vulkan renderer would not work."
          exit 1
        fi
        ninja -C build
        sudo ninja install -C build
        sudo ldconfig
        cd ..

    - name: Build FFmpeg
      run: |
        export FFMPEG_REV=n9.0
        export FFMPEG_CONFIGURE_ARGS="--enable-pic --enable-lto --disable-static --enable-shared --disable-all --disable-autodetect --enable-avcodec --enable-avformat --enable-swscale --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=av1 --enable-vaapi --enable-hwaccel=h264_vaapi --enable-hwaccel=hevc_vaapi --enable-hwaccel=av1_vaapi --enable-vdpau --enable-hwaccel=h264_vdpau --enable-hwaccel=hevc_vdpau --enable-hwaccel=av1_vdpau --enable-libdrm --enable-vulkan --enable-hwaccel=h264_vulkan --enable-hwaccel=hevc_vulkan --enable-hwaccel=av1_vulkan --enable-libdav1d --enable-decoder=libdav1d"
        git clone https://github.com/FFmpeg/FFmpeg.git FFmpeg
        cd FFmpeg
        git checkout $FFMPEG_REV
        ./configure $FFMPEG_CONFIGURE_ARGS
        make -j$(nproc)
        sudo make install
        sudo ldconfig
        cd ..

    - name: Show ccache stats
      run: ccache --show-stats

    - name: Install linuxdeploy
      run: |
        mkdir -p $HOME/bin
        # Match build-appimage.sh's linuxdeploy-$(uname -m).AppImage filename.
        # Both runner architectures match the upstream x86_64/aarch64 asset names.
        wget -O $HOME/bin/linuxdeploy-${{ matrix.arch }}.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage
        wget -O $HOME/bin/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage
        chmod a+x $HOME/bin/linuxdeploy*.AppImage

    - name: Setup FUSE for AppImage
      run: |
        # Configure FUSE for AppImage in CI environment
        echo "Setting up FUSE environment for AppImage..."

        # Check if FUSE is available
        if [ -f /dev/fuse ]; then
          echo "✅ /dev/fuse is available"
        else
          echo "❌ /dev/fuse not found, trying to create..."
          sudo mknod /dev/fuse c 10 229 || echo "Failed to create /dev/fuse"
          sudo chmod 666 /dev/fuse || echo "Failed to set permissions on /dev/fuse"
        fi

        # Check FUSE library
        ldconfig -p | grep fuse || echo "FUSE library not found in ldconfig"

        # Set environment variable for AppImage extraction mode if FUSE fails
        echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

    - name: Get version
      run: |
        VERSION=$(python3 scripts/derive-version.py --field artifact)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "CI_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build AppImage
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
      run: |
        # Use the Qt 6 environment; Qt 5 environment variables are obsolete.
        # export QT_SELECT=5
        # export PATH=/usr/lib/qt5/bin:$PATH
        # export QT_QPA_PLATFORM_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt5/plugins

        # Add linuxdeploy to PATH
        export PATH=$PATH:$HOME/bin

        echo "Building AppImage with CI-optimized settings..."
        echo "APPIMAGE_EXTRACT_AND_RUN=$APPIMAGE_EXTRACT_AND_RUN"
        echo "PATH includes: $HOME/bin"

        # Run the build script
        scripts/build-appimage.sh

    - name: Verify AppImage
      run: |
        appimage="build/installer-release/Moonlight-VPlus-${VERSION}-${{ matrix.arch }}.AppImage"

        if [[ ! -s "$appimage" ]]; then
          echo "::error file=$appimage::AppImage is missing or empty"
          exit 1
        fi

        if [[ ! -s "${appimage}.zsync" ]]; then
          echo "::error file=${appimage}.zsync::zsync is missing or empty"
          exit 1
        fi

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-VPlus-r${{ env.BUILD_NUMBER }}-${{ matrix.arch }}.AppImage
        path: |
          build/installer-release/Moonlight-VPlus-*-${{ matrix.arch }}.AppImage
          build/installer-release/Moonlight-VPlus-*-${{ matrix.arch }}.AppImage.zsync
        if-no-files-found: error


  build-steamlink:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y libc6:i386 libstdc++6:i386

    - name: Derive weekly cache key
      run: echo "WEEK=$(date +%G-W%V)" >> $GITHUB_ENV

    - name: Restore SteamLink SDK
      id: steamlink-sdk
      uses: actions/cache@v4
      with:
        path: ~/steamlink-sdk
        key: steamlink-sdk-${{ env.WEEK }}
        restore-keys: |
          steamlink-sdk-

    - name: Download SteamLink SDK
      if: steps.steamlink-sdk.outputs.cache-hit != 'true'
      run: |
        # A fallback cache may contain last week's SDK. Fetch and reset to upstream
        # HEAD before saving this week's cache so an old checkout cannot persist forever.
        if [ -d "$HOME/steamlink-sdk/.git" ]; then
          git -C "$HOME/steamlink-sdk" fetch --depth=1 origin
          git -C "$HOME/steamlink-sdk" remote set-head origin --auto
          git -C "$HOME/steamlink-sdk" reset --hard origin/HEAD
        else
          git clone --depth=1 https://github.com/ValveSoftware/steamlink-sdk.git "$HOME/steamlink-sdk"
        fi

    - name: Get version
      run: |
        VERSION=$(python3 scripts/derive-version.py --field artifact)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "CI_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build SteamLink app
      run: |
        STEAMLINK_SDK_PATH=$HOME/steamlink-sdk scripts/build-steamlink-app.sh

    - name: Upload SteamLink artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-VPlus-SteamLink-r${{ env.BUILD_NUMBER }}
        path: build/installer-release/Moonlight-VPlus-SteamLink-*.zip

  release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref_type == 'tag')
    needs: [qml-lint, version-tests, cpp-format, build-windows, build-macos, build-linux, build-steamlink]
    runs-on: ubuntu-latest

    steps:
    - name: Verify existing release before replacing assets
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: |
          **/*.exe
          **/*.zip
          **/*.dmg
          **/*.AppImage
          **/*.AppImage.zsync
      env:
        GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
