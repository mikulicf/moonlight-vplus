name: Upstream sync status

on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-status
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test upstream reporting
        run: python3 -m unittest discover -s tests/upstream_status -v
      - name: Check both upstreams
        run: |
          python3 scripts/upstream-status.py --output upstream-status.md
          cat upstream-status.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-status
          path: upstream-status.md
