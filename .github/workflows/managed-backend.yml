name: Managed backend
on:
  push:
    branches: [master]
    paths: ['control/**', '.github/workflows/managed-backend.yml']
  pull_request:
    branches: [master]
    paths: ['control/**', '.github/workflows/managed-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: control/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: control
      - run: node --check control/internal/server/web/app.js
      - name: Build service and agents
        working-directory: control
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/moonlight-control-linux-amd64 ./cmd/moonlight-control
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/moonlight-agent-linux-amd64 ./cmd/moonlight-agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/moonlight-agent-windows-amd64.exe ./cmd/moonlight-agent
      - uses: actions/upload-artifact@v4
        with:
          name: Managed-backend-and-agents
          path: control/dist/*
          if-no-files-found: error
